<!DOCTYPE html>
<html>
<head>
    <title>PRIME ONYX - Stress Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #0f0; font-family: monospace; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #f00; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; color: #0f0; border: 1px solid #0f0; border-radius: 5px; }
        button { background: #f00; color: #fff; cursor: pointer; font-weight: bold; }
        .status { margin-top: 20px; padding: 10px; background: #1a1a1a; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 PRIME ONYX STRESS PANEL 🔥</h1>
        <input type="text" id="ip" placeholder="Target IP">
        <input type="number" id="port" placeholder="Port">
        <input type="number" id="time" placeholder="Duration (sec)">
        <button onclick="attack()">💥 LAUNCH ATTACK 💥</button>
        <div class="status" id="status">Ready</div>
    </div>
    <script>
        const API_URL = window.location.origin;
        
        async function attack() {
            const ip = document.getElementById('ip').value;
            const port = document.getElementById('port').value;
            const time = document.getElementById('time').value;
            const statusDiv = document.getElementById('status');
            
            if (!ip || !port || !time) {
                statusDiv.innerHTML = '❌ Fill all fields!';
                return;
            }
            
            statusDiv.innerHTML = '🚀 Starting attack...';
            
            try {
                const res = await fetch(`${API_URL}/attack`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip, port, time })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    statusDiv.innerHTML = `✅ Attack on ${ip}:${port} for ${time}s started!`;
                } else {
                    statusDiv.innerHTML = '❌ Attack failed!';
                }
            } catch(e) {
                statusDiv.innerHTML = '❌ Error!';
            }
        }
    </script>
</body>
</html>
